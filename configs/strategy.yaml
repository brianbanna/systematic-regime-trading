strategies:
  binary_regime:
    description: "High equity in calm, reduced in turbulent"
    allocation:
      calm: 1.0
      moderate: 0.65
      turbulent: 0.30

  proportional_regime:
    description: "Allocation proportional to P(calm)"
    method: "probability_weighted"

  vol_targeted:
    description: "Scale allocation to hit vol target per regime"
    vol_target: 0.12          # 12% annualized (higher target = more invested)
    vol_lookback_days: 126    # 6-month lookback (less reactive)

  regime_momentum:
    description: "Full allocation in persistent calm, partial in turbulent"
    persistence_threshold_days: 15
    allocation:
      calm_persistent: 1.0
      calm_new: 1.0
      moderate: 0.65
      turbulent: 0.25

  regime_vol_targeted:
    description: "Different vol target per regime"
    vol_targets:
      calm: 0.14              # 14% in calm (aggressive)
      moderate: 0.10           # 10% in moderate
      turbulent: 0.06          # 6% in turbulent
    vol_lookback_days: 126

signal_filters:
  confirmation_days: 3                   # Symmetric
  confirmation_days_defensive: 3         # Same as symmetric (reduce false positives)
  confirmation_days_risk_on: 3           # Same (faster re-entry)
  max_daily_allocation_change: 0.15      # Slower transitions = less turnover

rebalance:
  frequency: "daily"
  day_of_week: null
